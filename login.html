<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>AnimeHub</title>
    <link rel="stylesheet" href="./css/loginstyle.css" />
  </head>
  <body>
    <main class="container">
      <form action="">
        <!-- Form indica que vai ser um formulario -->

        <h1>Login AnimeHub</h1>
        <div class="input-box">
          <input placeholder="User" type="email" />
          <!-- input recebe (placeholder e um nome de indentificar) (type e o tipo) -->
          <i class="bx bxs-user"></i>
        </div>

        <div class="input-box">
          <input placeholder="Password" type="password" />
          <i class="bx bxs-lock-alt"></i>
        </div>

        <div class="remember-forgot">
          <label>
            <!-- label e uma legenda para um formulario -->
            <input type="checkbox" />
            Remember me
          </label>
          <a>Forgot password?</a>
        </div>

        <button type="submit" class="login" >Login</button>

        <div class="register-link">
          <p>Dont have an account? <a href="./index.html">Create now!</a></p>
        </div>
      </form>
    </main>
  </body>
</html>
